<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <!-- dusk sky over Oomaruyama -->
  <rect x="0" y="0" width="800" height="330" fill="#5f7086"/>
  <!-- early stars -->
  <g fill="#f5efdc">
    <circle cx="90" cy="60" r="3"/>
    <circle cx="180" cy="40" r="2.5"/>
    <circle cx="330" cy="70" r="3"/>
    <circle cx="470" cy="45" r="2.5"/>
    <circle cx="620" cy="80" r="3"/>
    <circle cx="730" cy="50" r="2.5"/>
  </g>
  <!-- moon -->
  <circle cx="690" cy="90" r="26" fill="#f5efdc"/>
  <circle cx="680" cy="84" r="5" fill="#e0d6b8"/>
  <circle cx="700" cy="98" r="4" fill="#e0d6b8"/>
  <!-- distant forested hill -->
  <polygon points="0,330 260,240 520,300 800,250 800,330" fill="#3d4a3a"/>
  <!-- ground: forest park slope -->
  <polygon points="0,330 800,330 800,500 0,500" fill="#4a5a42"/>
  <!-- pine trees -->
  <g fill="#2f4030">
    <polygon points="60,330 90,240 120,330"/>
    <polygon points="70,300 90,240 110,300" fill="#3a4c38"/>
    <polygon points="700,330 730,235 760,330"/>
    <polygon points="710,300 730,235 750,300" fill="#3a4c38"/>
    <polygon points="640,330 662,260 684,330"/>
  </g>
  <rect x="86" y="330" width="8" height="20" fill="#5a4632"/>
  <rect x="726" y="330" width="8" height="20" fill="#5a4632"/>
  <!-- Santa house: red A-frame with warm windows -->
  <g>
    <polygon points="380,330 500,190 620,330" fill="#a83a2e" stroke="#7e2a20" stroke-width="3"/>
    <polygon points="420,330 500,220 580,330" fill="#c0503f"/>
    <rect x="478" y="280" width="44" height="50" fill="#6b4a2f" stroke="#4a3220" stroke-width="2"/>
    <circle cx="516" cy="306" r="3" fill="#f5e6a0"/>
    <rect x="440" y="286" width="26" height="26" fill="#f5e6a0" stroke="#7e2a20" stroke-width="2"/>
    <rect x="534" y="286" width="26" height="26" fill="#f5e6a0" stroke="#7e2a20" stroke-width="2"/>
    <polygon points="500,190 500,176 512,190" fill="#f5e6a0"/>
    <!-- chimney with smoke -->
    <rect x="548" y="222" width="18" height="34" fill="#8f7f6d" stroke="#6b5a48" stroke-width="2"/>
    <g stroke="#dde7ec" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.8">
      <path d="M557 218 q8 -12 2 -22"/>
      <path d="M562 192 q8 -10 2 -18"/>
    </g>
    <!-- string lights along the roof edge -->
    <g fill="#f5e6a0">
      <circle cx="400" cy="308" r="4"/>
      <circle cx="420" cy="284" r="4"/>
      <circle cx="440" cy="260" r="4"/>
      <circle cx="460" cy="236" r="4"/>
      <circle cx="480" cy="214" r="4"/>
      <circle cx="520" cy="214" r="4"/>
      <circle cx="540" cy="236" r="4"/>
      <circle cx="560" cy="260" r="4"/>
      <circle cx="580" cy="284" r="4"/>
      <circle cx="600" cy="308" r="4"/>
    </g>
  </g>
  <!-- wooden lanterns hanging over the path -->
  <g>
    <line x1="300" y1="330" x2="300" y2="380" stroke="#5a4632" stroke-width="4"/>
    <line x1="300" y1="380" x2="700" y2="380" stroke="#5a4632" stroke-width="3"/>
    <line x1="700" y1="330" x2="700" y2="380" stroke="#5a4632" stroke-width="4"/>
    <g fill="#f5e6a0" stroke="#8a6a3a" stroke-width="2">
      <rect x="340" y="380" width="18" height="24" rx="3"/>
      <rect x="420" y="380" width="18" height="24" rx="3"/>
      <rect x="500" y="380" width="18" height="24" rx="3"/>
      <rect x="580" y="380" width="18" height="24" rx="3"/>
      <rect x="650" y="380" width="18" height="24" rx="3"/>
    </g>
  </g>
  <!-- path -->
  <polygon points="330,500 380,404 620,404 700,500" fill="#8a7a5e"/>
  <!-- sign: Santa Land -->
  <g>
    <rect x="150" y="392" width="8" height="70" fill="#6b543a"/>
    <rect x="100" y="356" width="110" height="42" rx="4" fill="#f5efdc" stroke="#6b543a" stroke-width="2"/>
    <text x="155" y="384" font-family="Noto Sans CJK JP" font-size="17" fill="#4a3a28" text-anchor="middle">サンタランド</text>
  </g>
  <!-- house character, standing on the path, looking up at the lights -->
  <g transform="translate(370,268) scale(0.42)">
    <!-- legs -->
    <line x1="140" y1="425" x2="140" y2="456" stroke="#5a4632" stroke-width="8" stroke-linecap="round"/>
    <line x1="200" y1="425" x2="200" y2="456" stroke="#5a4632" stroke-width="8" stroke-linecap="round"/>
    <!-- left arm down -->
    <line x1="100" y1="355" x2="78" y2="386" stroke="#5a4632" stroke-width="7" stroke-linecap="round"/>
    <circle cx="75" cy="389" r="9" fill="#5a4632"/>
    <!-- body -->
    <rect x="98" y="288" width="150" height="140" fill="#a8d4ea" stroke="#7fb3d0" stroke-width="3"/>
    <!-- roof -->
    <polygon points="80,292 173,210 266,292" fill="#c9b8a3" stroke="#a89880" stroke-width="3"/>
    <!-- chimney -->
    <rect x="212" y="222" width="24" height="40" fill="#b0a090" stroke="#8f7f6d" stroke-width="2"/>
    <!-- windows -->
    <rect x="116" y="320" width="32" height="32" fill="#f5e6c4" stroke="#7fb3d0" stroke-width="2"/>
    <rect x="192" y="320" width="32" height="32" fill="#f5e6c4" stroke="#7fb3d0" stroke-width="2"/>
    <!-- door -->
    <rect x="154" y="362" width="36" height="63" fill="#ffffff" stroke="#7fb3d0" stroke-width="2"/>
    <circle cx="184" cy="394" r="3" fill="#7fb3d0"/>
    <!-- face: dot eyes and smile above windows -->
    <circle cx="134" cy="306" r="5" fill="#222222"/>
    <circle cx="212" cy="306" r="5" fill="#222222"/>
    <path d="M160 312 Q173 320 186 312" stroke="#222222" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- right arm raised toward the lanterns -->
    <line x1="248" y1="355" x2="296" y2="330" stroke="#7fb8d8" stroke-width="7" stroke-linecap="round"/>
    <circle cx="300" cy="328" r="10" fill="#7fb8d8"/>
  </g>
</svg>
