<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <!-- 空（朝の霧から晴れへ） -->
  <rect x="0" y="0" width="800" height="430" fill="#dceef7"/>
  <!-- 太陽（右上、霧の向こうから出てきたところ） -->
  <circle cx="690" cy="80" r="34" fill="#f6d96b"/>
  <g stroke="#f6d96b" stroke-width="6" stroke-linecap="round">
    <line x1="690" y1="28" x2="690" y2="12"/>
    <line x1="690" y1="132" x2="690" y2="148"/>
    <line x1="638" y1="80" x2="622" y2="80"/>
    <line x1="742" y1="80" x2="758" y2="80"/>
    <line x1="654" y1="44" x2="643" y2="33"/>
    <line x1="726" y1="116" x2="737" y2="127"/>
  </g>
  <!-- 残る霧（左側に漂う帯） -->
  <ellipse cx="180" cy="120" rx="150" ry="26" fill="#ffffff" opacity="0.75"/>
  <ellipse cx="330" cy="170" rx="170" ry="24" fill="#ffffff" opacity="0.6"/>
  <ellipse cx="120" cy="220" rx="120" ry="20" fill="#ffffff" opacity="0.55"/>
  <!-- 地面（庭の草） -->
  <rect x="0" y="430" width="800" height="70" fill="#a8c686"/>
  <line x1="0" y1="430" x2="800" y2="430" stroke="#8fae6e" stroke-width="3"/>
  <!-- 家（自画像の型、左） -->
  <!-- 脚 -->
  <rect x="160" y="416" width="16" height="16" fill="#8a6b4a"/>
  <rect x="230" y="416" width="16" height="16" fill="#8a6b4a"/>
  <!-- 壁 -->
  <rect x="120" y="270" width="160" height="150" fill="#a8d4e8"/>
  <!-- 屋根（グレージュの三角） -->
  <polygon points="105,272 200,185 295,272" fill="#b8ac9a"/>
  <!-- 煙突 -->
  <rect x="236" y="190" width="24" height="26" fill="#9a8f80"/>
  <rect x="232" y="184" width="32" height="10" fill="#8a7e6e"/>
  <!-- 窓（ベージュ2つ） -->
  <rect x="140" y="300" width="40" height="40" fill="#e8d9b0"/>
  <rect x="210" y="300" width="40" height="40" fill="#e8d9b0"/>
  <line x1="160" y1="300" x2="160" y2="340" stroke="#a8d4e8" stroke-width="3"/>
  <line x1="140" y1="320" x2="180" y2="320" stroke="#a8d4e8" stroke-width="3"/>
  <line x1="230" y1="300" x2="230" y2="340" stroke="#a8d4e8" stroke-width="3"/>
  <line x1="210" y1="320" x2="250" y2="320" stroke="#a8d4e8" stroke-width="3"/>
  <!-- 扉（白） -->
  <rect x="185" y="345" width="38" height="75" fill="#ffffff"/>
  <circle cx="216" cy="382" r="3" fill="#8a6b4a"/>
  <!-- 顔（点の目2つと小さな笑口） -->
  <circle cx="170" cy="290" r="4.5" fill="#222222"/>
  <circle cx="230" cy="290" r="4.5" fill="#222222"/>
  <path d="M 188 306 Q 200 313 212 306" stroke="#222222" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- 腕（左腕は下ろし、右腕を太陽の方へ上げる） -->
  <line x1="120" y1="330" x2="98" y2="356" stroke="#a8d4e8" stroke-width="10" stroke-linecap="round"/>
  <circle cx="94" cy="360" r="10" fill="#a8d4e8"/>
  <line x1="280" y1="330" x2="330" y2="300" stroke="#a8d4e8" stroke-width="10" stroke-linecap="round"/>
  <circle cx="334" cy="298" r="10" fill="#a8d4e8"/>
  <!-- ミケ（庭で座って様子を見ている三毛猫） -->
  <ellipse cx="420" cy="452" rx="34" ry="26" fill="#f5f0e6"/>
  <circle cx="420" cy="412" r="20" fill="#f5f0e6"/>
  <polygon points="406,396 402,378 416,390" fill="#f5f0e6"/>
  <polygon points="434,396 438,378 424,390" fill="#f5f0e6"/>
  <path d="M 400 398 Q 420 380 440 398 L 440 414 L 400 414 Z" fill="#d98a4a"/>
  <path d="M 396 440 Q 410 430 424 442 L 424 470 L 392 470 Q 388 452 396 440" fill="#5a5a5a"/>
  <circle cx="413" cy="410" r="2.5" fill="#222222"/>
  <circle cx="427" cy="410" r="2.5" fill="#222222"/>
  <path d="M 452 452 Q 478 446 472 424" stroke="#f5f0e6" stroke-width="9" fill="none" stroke-linecap="round"/>
  <!-- 郵便受け（右、届いた荷物） -->
  <rect x="620" y="392" width="14" height="40" fill="#7a6a55"/>
  <rect x="580" y="330" width="94" height="62" rx="8" fill="#4a7ba6"/>
  <rect x="580" y="330" width="94" height="14" rx="7" fill="#3a6a96"/>
  <line x1="598" y1="356" x2="656" y2="356" stroke="#dceef7" stroke-width="4"/>
  <!-- 小さな段ボール箱（郵便受けの上に置かれた荷物） -->
  <rect x="596" y="296" width="62" height="34" fill="#c9a06a"/>
  <line x1="627" y1="296" x2="627" y2="330" stroke="#a8824e" stroke-width="3"/>
  <rect x="606" y="308" width="42" height="12" fill="#f2e8d8"/>
</svg>
