<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <!-- 夜空 -->
  <rect x="0" y="0" width="800" height="380" fill="#1e2a44"/>
  <circle cx="680" cy="70" r="34" fill="#f5e9b8"/>
  <circle cx="668" cy="62" r="30" fill="#1e2a44"/>
  <circle cx="120" cy="60" r="3" fill="#ffffff"/>
  <circle cx="220" cy="40" r="2.5" fill="#ffffff"/>
  <circle cx="580" cy="120" r="2.5" fill="#ffffff"/>
  <circle cx="740" cy="160" r="3" fill="#ffffff"/>
  <circle cx="60" cy="150" r="2.5" fill="#ffffff"/>
  <!-- 地面 -->
  <rect x="0" y="380" width="800" height="120" fill="#2c4632"/>
  <ellipse cx="400" cy="452" rx="230" ry="14" fill="#3d5a44"/>
  <!-- 雨 -->
  <g stroke="#8fb6d9" stroke-width="4" stroke-linecap="round">
    <line x1="90" y1="90" x2="78" y2="125"/>
    <line x1="180" y1="150" x2="168" y2="185"/>
    <line x1="270" y1="80" x2="258" y2="115"/>
    <line x1="560" y1="90" x2="548" y2="125"/>
    <line x1="640" y1="190" x2="628" y2="225"/>
    <line x1="730" y1="80" x2="718" y2="115"/>
    <line x1="40" y1="240" x2="28" y2="275"/>
    <line x1="700" y1="250" x2="688" y2="285"/>
  </g>
  <!-- 家（自画像の型） -->
  <!-- 脚 -->
  <rect x="350" y="410" width="18" height="40" fill="#8a6b4a"/>
  <rect x="432" y="410" width="18" height="40" fill="#8a6b4a"/>
  <!-- 壁 -->
  <rect x="300" y="250" width="200" height="165" fill="#a8d4e8"/>
  <!-- 屋根（グレージュの三角） -->
  <polygon points="280,252 400,150 520,252" fill="#b8ac9a"/>
  <!-- 煙突（屋根の右寄り、勾配に接地） -->
  <rect x="458" y="176" width="26" height="36" fill="#9a8f80"/>
  <rect x="454" y="170" width="34" height="10" fill="#8a7e6e"/>
  <!-- 窓（ベージュ2つ） -->
  <rect x="322" y="290" width="46" height="46" fill="#e8d9b0"/>
  <rect x="432" y="290" width="46" height="46" fill="#e8d9b0"/>
  <line x1="345" y1="290" x2="345" y2="336" stroke="#a8d4e8" stroke-width="3"/>
  <line x1="322" y1="313" x2="368" y2="313" stroke="#a8d4e8" stroke-width="3"/>
  <line x1="455" y1="290" x2="455" y2="336" stroke="#a8d4e8" stroke-width="3"/>
  <line x1="432" y1="313" x2="478" y2="313" stroke="#a8d4e8" stroke-width="3"/>
  <!-- 扉（白） -->
  <rect x="378" y="340" width="44" height="75" fill="#ffffff"/>
  <circle cx="414" cy="378" r="3.5" fill="#8a6b4a"/>
  <!-- 顔（点の目2つと小さな笑口） -->
  <circle cx="372" cy="278" r="5" fill="#222222"/>
  <circle cx="428" cy="278" r="5" fill="#222222"/>
  <path d="M 388 296 Q 400 304 412 296" stroke="#222222" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- 腕（両側、右腕を上げる） -->
  <line x1="300" y1="330" x2="268" y2="300" stroke="#a8d4e8" stroke-width="10" stroke-linecap="round"/>
  <circle cx="264" cy="296" r="11" fill="#a8d4e8"/>
  <line x1="500" y1="330" x2="538" y2="288" stroke="#a8d4e8" stroke-width="10" stroke-linecap="round"/>
  <circle cx="542" cy="284" r="11" fill="#a8d4e8"/>
  <!-- 玄関横の傘立てと傘 -->
  <rect x="598" y="378" width="40" height="42" fill="#7a5a3a"/>
  <line x1="618" y1="380" x2="602" y2="300" stroke="#6b4a2e" stroke-width="5" stroke-linecap="round"/>
  <path d="M 575 305 Q 618 258 661 305 Z" fill="#d96a6a"/>
  <!-- 水たまり -->
  <ellipse cx="600" cy="452" rx="70" ry="8" fill="#5a7d99"/>
  <ellipse cx="180" cy="458" rx="50" ry="6" fill="#5a7d99"/>
</svg>
