<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <!-- sky: cold November grey-blue -->
  <rect x="0" y="0" width="800" height="290" fill="#dfe9ec"/>
  <!-- distant mountains -->
  <polygon points="0,290 120,210 260,270 400,200 540,275 680,215 800,280 800,290 0,290" fill="#8fa3a8"/>
  <!-- valley: left orange slope -->
  <polygon points="0,290 260,290 200,500 0,500" fill="#c97e3f"/>
  <!-- valley: right rust slope -->
  <polygon points="540,290 800,290 800,500 600,500" fill="#b5652f"/>
  <!-- valley floor: grey-white rock -->
  <polygon points="260,290 540,290 600,500 200,500" fill="#cfc9bd"/>
  <!-- rock patches on the floor -->
  <ellipse cx="330" cy="420" rx="55" ry="18" fill="#b9b2a4"/>
  <ellipse cx="480" cy="450" rx="70" ry="20" fill="#b9b2a4"/>
  <ellipse cx="400" cy="330" rx="45" ry="14" fill="#a89e8d"/>
  <!-- orange streaks on the slopes -->
  <polygon points="60,290 150,290 120,420 30,420" fill="#d99a55"/>
  <polygon points="660,290 740,290 770,430 690,430" fill="#cf8a4a"/>
  <!-- wooden walkway on the valley floor -->
  <g fill="#8a6a45" stroke="#6f5333" stroke-width="1.5">
    <rect x="225" y="340" width="52" height="10"/>
    <rect x="235" y="365" width="52" height="10"/>
    <rect x="245" y="390" width="52" height="10"/>
    <rect x="255" y="415" width="52" height="10"/>
  </g>
  <!-- steam vents: white puffs rising from the valley -->
  <g fill="#ffffff">
    <ellipse cx="400" cy="360" rx="60" ry="26" opacity="0.75"/>
    <ellipse cx="380" cy="325" rx="42" ry="20" opacity="0.65"/>
    <ellipse cx="430" cy="300" rx="36" ry="16" opacity="0.6"/>
    <ellipse cx="300" cy="430" rx="45" ry="18" opacity="0.7"/>
    <ellipse cx="520" cy="400" rx="50" ry="20" opacity="0.7"/>
    <ellipse cx="470" cy="455" rx="40" ry="15" opacity="0.55"/>
    <ellipse cx="340" cy="470" rx="38" ry="14" opacity="0.55"/>
  </g>
  <!-- bubbling iron spring pool -->
  <ellipse cx="400" cy="440" rx="52" ry="14" fill="#7a9aa8" stroke="#5a7a88" stroke-width="2"/>
  <circle cx="385" cy="438" r="5" fill="#ffffff" opacity="0.8"/>
  <circle cx="405" cy="442" r="4" fill="#ffffff" opacity="0.8"/>
  <circle cx="418" cy="436" r="3" fill="#ffffff" opacity="0.8"/>
  <!-- red demon statue (Yukijin) on the right -->
  <g>
    <!-- stone base -->
    <rect x="618" y="438" width="120" height="22" fill="#9a9a94" stroke="#7a7a74" stroke-width="2"/>
    <!-- legs -->
    <rect x="640" y="400" width="22" height="40" fill="#c93324"/>
    <rect x="688" y="400" width="22" height="40" fill="#c93324"/>
    <!-- body -->
    <rect x="632" y="310" width="86" height="95" rx="12" fill="#d43d2a" stroke="#a82c1e" stroke-width="3"/>
    <!-- belly -->
    <ellipse cx="675" cy="365" rx="28" ry="30" fill="#e8705f"/>
    <!-- left arm down -->
    <line x1="636" y1="330" x2="612" y2="372" stroke="#c93324" stroke-width="12" stroke-linecap="round"/>
    <circle cx="610" cy="376" r="9" fill="#c93324"/>
    <!-- head -->
    <circle cx="675" cy="272" r="40" fill="#d43d2a" stroke="#a82c1e" stroke-width="3"/>
    <!-- horns -->
    <polygon points="648,242 640,205 668,232" fill="#f5e6c4" stroke="#d9c9a8" stroke-width="2"/>
    <polygon points="702,242 710,205 682,232" fill="#f5e6c4" stroke="#d9c9a8" stroke-width="2"/>
    <!-- angry brows and eyes -->
    <line x1="648" y1="258" x2="668" y2="266" stroke="#7a1f14" stroke-width="4" stroke-linecap="round"/>
    <line x1="702" y1="258" x2="682" y2="266" stroke="#7a1f14" stroke-width="4" stroke-linecap="round"/>
    <circle cx="658" cy="274" r="6" fill="#ffffff"/>
    <circle cx="692" cy="274" r="6" fill="#ffffff"/>
    <circle cx="659" cy="275" r="3" fill="#222222"/>
    <circle cx="691" cy="275" r="3" fill="#222222"/>
    <!-- mouth with fangs -->
    <path d="M658 292 Q675 306 692 292" stroke="#7a1f14" stroke-width="3" fill="none" stroke-linecap="round"/>
    <polygon points="662,293 666,301 670,293" fill="#ffffff"/>
    <polygon points="680,293 684,301 688,293" fill="#ffffff"/>
    <!-- right arm raised, holding spiked club -->
    <line x1="714" y1="330" x2="748" y2="286" stroke="#c93324" stroke-width="12" stroke-linecap="round"/>
    <circle cx="752" cy="282" r="9" fill="#c93324"/>
    <!-- club: vertical, its lower end in the hand -->
    <g>
      <rect x="744" y="180" width="16" height="106" rx="6" fill="#7a5f38" stroke="#5a4632" stroke-width="2"/>
      <circle cx="752" cy="196" r="6" fill="#d9d9d9"/>
      <circle cx="752" cy="224" r="6" fill="#d9d9d9"/>
      <circle cx="752" cy="252" r="6" fill="#d9d9d9"/>
    </g>
  </g>
  <!-- house character, bottom left, looking toward the steam and the demon -->
  <g>
    <!-- legs -->
    <line x1="140" y1="425" x2="140" y2="456" stroke="#5a4632" stroke-width="8" stroke-linecap="round"/>
    <line x1="200" y1="425" x2="200" y2="456" stroke="#5a4632" stroke-width="8" stroke-linecap="round"/>
    <!-- left arm down -->
    <line x1="100" y1="355" x2="78" y2="386" stroke="#5a4632" stroke-width="7" stroke-linecap="round"/>
    <circle cx="75" cy="389" r="9" fill="#5a4632"/>
    <!-- body -->
    <rect x="98" y="288" width="150" height="140" fill="#a8d4ea" stroke="#7fb3d0" stroke-width="3"/>
    <!-- roof -->
    <polygon points="80,292 173,210 266,292" fill="#c9b8a3" stroke="#a89880" stroke-width="3"/>
    <!-- chimney -->
    <rect x="212" y="222" width="24" height="40" fill="#b0a090" stroke="#8f7f6d" stroke-width="2"/>
    <!-- windows -->
    <rect x="116" y="320" width="32" height="32" fill="#f5e6c4" stroke="#7fb3d0" stroke-width="2"/>
    <rect x="192" y="320" width="32" height="32" fill="#f5e6c4" stroke="#7fb3d0" stroke-width="2"/>
    <!-- door -->
    <rect x="154" y="362" width="36" height="63" fill="#ffffff" stroke="#7fb3d0" stroke-width="2"/>
    <circle cx="184" cy="394" r="3" fill="#7fb3d0"/>
    <!-- face: dot eyes and smile above windows -->
    <circle cx="134" cy="306" r="5" fill="#222222"/>
    <circle cx="212" cy="306" r="5" fill="#222222"/>
    <path d="M160 312 Q173 320 186 312" stroke="#222222" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- right arm raised toward the steam -->
    <line x1="248" y1="355" x2="298" y2="312" stroke="#5a4632" stroke-width="7" stroke-linecap="round"/>
    <circle cx="303" cy="308" r="10" fill="#5a4632"/>
  </g>
</svg>
