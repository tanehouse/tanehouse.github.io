<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <!-- pale November sky -->
  <rect x="0" y="0" width="800" height="330" fill="#dde7ec"/>
  <!-- wind curves -->
  <g stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.85">
    <path d="M40 90 q60 -18 120 -4"/>
    <path d="M300 60 q60 -16 120 -2"/>
    <path d="M560 100 q60 -16 120 -4"/>
    <path d="M180 150 q50 -12 100 -2"/>
  </g>
  <!-- gulls -->
  <g stroke="#5a6a72" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M620 70 q10 -10 20 0 q10 -10 20 0"/>
    <path d="M680 120 q8 -8 16 0 q8 -8 16 0"/>
  </g>
  <!-- sea -->
  <polygon points="0,330 800,330 800,500 0,500" fill="#6f9ab2"/>
  <polygon points="0,330 800,330 800,380 0,400" fill="#7fa8bd"/>
  <!-- waves -->
  <g stroke="#e8f0f2" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M540 380 q20 -8 40 0"/>
    <path d="M620 430 q20 -8 40 0"/>
    <path d="M520 460 q20 -8 40 0"/>
    <path d="M680 470 q20 -8 40 0"/>
  </g>
  <!-- reef rocks with seals -->
  <g fill="#4a4a44">
    <polygon points="560,392 590,352 640,352 668,392"/>
    <polygon points="690,396 712,362 748,362 766,396"/>
    <polygon points="520,396 540,372 570,372 584,396"/>
  </g>
  <!-- seals resting on the rocks -->
  <g fill="#9aa0a6" stroke="#6a6f75" stroke-width="2">
    <ellipse cx="600" cy="352" rx="26" ry="9"/>
    <ellipse cx="632" cy="356" rx="20" ry="8"/>
    <ellipse cx="726" cy="362" rx="22" ry="8"/>
    <ellipse cx="552" cy="372" rx="18" ry="7"/>
  </g>
  <g fill="#6a6f75">
    <circle cx="578" cy="348" r="4"/>
    <circle cx="648" cy="352" r="3.5"/>
    <circle cx="710" cy="358" r="3.5"/>
  </g>
  <!-- cape headland: grassy top, rocky face -->
  <polygon points="0,330 430,330 500,500 0,500" fill="#6d7a52"/>
  <polygon points="0,330 430,330 470,410 0,500" fill="#7d8578" opacity="0.55"/>
  <polygon points="0,330 430,330 500,500 0,500" fill="#5c6b45" opacity="0.25"/>
  <!-- grass tufts on the cape -->
  <g stroke="#4a5a38" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M60 360 q4 -14 0 -22"/>
    <path d="M70 362 q6 -12 2 -20"/>
    <path d="M150 350 q4 -14 0 -22"/>
    <path d="M240 345 q4 -12 0 -20"/>
  </g>
  <!-- Erimo lighthouse: white tower with red band -->
  <g>
    <rect x="322" y="216" width="34" height="114" fill="#f5f2ea" stroke="#c9c4b4" stroke-width="2"/>
    <rect x="322" y="262" width="34" height="14" fill="#c0392b"/>
    <rect x="322" y="296" width="34" height="12" fill="#c0392b"/>
    <rect x="318" y="196" width="42" height="20" fill="#3a3a3a"/>
    <rect x="326" y="202" width="26" height="10" fill="#f5e6a0"/>
    <polygon points="314,196 339,180 364,196" fill="#c0392b"/>
    <rect x="330" y="330" width="18" height="0" fill="#f5f2ea"/>
    <rect x="330" y="240" width="18" height="12" fill="#7fa8bd" stroke="#c9c4b4" stroke-width="1.5"/>
  </g>
  <!-- wooden sign: Erimo Misaki -->
  <g>
    <rect x="52" y="352" width="8" height="88" fill="#6b543a"/>
    <rect x="8" y="318" width="100" height="40" rx="4" fill="#f5efdc" stroke="#6b543a" stroke-width="2"/>
    <text x="58" y="346" font-family="Noto Sans CJK JP" font-size="19" fill="#4a3a28" text-anchor="middle">襟裳岬</text>
  </g>
  <!-- house character, standing on the cape, looking out to the sea -->
  <g transform="translate(150,102) scale(0.5)">
    <!-- legs -->
    <line x1="140" y1="425" x2="140" y2="456" stroke="#5a4632" stroke-width="8" stroke-linecap="round"/>
    <line x1="200" y1="425" x2="200" y2="456" stroke="#5a4632" stroke-width="8" stroke-linecap="round"/>
    <!-- left arm down -->
    <line x1="100" y1="355" x2="78" y2="386" stroke="#5a4632" stroke-width="7" stroke-linecap="round"/>
    <circle cx="75" cy="389" r="9" fill="#5a4632"/>
    <!-- body -->
    <rect x="98" y="288" width="150" height="140" fill="#a8d4ea" stroke="#7fb3d0" stroke-width="3"/>
    <!-- roof -->
    <polygon points="80,292 173,210 266,292" fill="#c9b8a3" stroke="#a89880" stroke-width="3"/>
    <!-- chimney -->
    <rect x="212" y="222" width="24" height="40" fill="#b0a090" stroke="#8f7f6d" stroke-width="2"/>
    <!-- windows -->
    <rect x="116" y="320" width="32" height="32" fill="#f5e6c4" stroke="#7fb3d0" stroke-width="2"/>
    <rect x="192" y="320" width="32" height="32" fill="#f5e6c4" stroke="#7fb3d0" stroke-width="2"/>
    <!-- door -->
    <rect x="154" y="362" width="36" height="63" fill="#ffffff" stroke="#7fb3d0" stroke-width="2"/>
    <circle cx="184" cy="394" r="3" fill="#7fb3d0"/>
    <!-- face: dot eyes and smile above windows -->
    <circle cx="134" cy="306" r="5" fill="#222222"/>
    <circle cx="212" cy="306" r="5" fill="#222222"/>
    <path d="M160 312 Q173 320 186 312" stroke="#222222" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- right arm raised toward the sea -->
    <line x1="248" y1="355" x2="296" y2="330" stroke="#7fb8d8" stroke-width="7" stroke-linecap="round"/>
    <circle cx="300" cy="328" r="10" fill="#7fb8d8"/>
  </g>
</svg>
