<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <!-- 夕方の空 -->
  <rect x="0" y="0" width="800" height="430" fill="#c3d2dd"/>
  <!-- 雲 -->
  <ellipse cx="140" cy="58" rx="95" ry="22" fill="#e8eef2"/>
  <ellipse cx="620" cy="48" rx="80" ry="18" fill="#e8eef2"/>
  <!-- 地面（庭先の草地） -->
  <rect x="0" y="430" width="800" height="70" fill="#6f8f6a"/>
  <rect x="0" y="430" width="800" height="10" fill="#7d9b78"/>
  <!-- 草 -->
  <g stroke="#5d7f58" stroke-width="4" stroke-linecap="round">
    <line x1="340" y1="430" x2="336" y2="414"/>
    <line x1="350" y1="430" x2="354" y2="412"/>
    <line x1="720" y1="430" x2="716" y2="414"/>
    <line x1="730" y1="430" x2="734" y2="412"/>
  </g>
  <!-- 家（自画像の型、左） -->
  <!-- 脚 -->
  <rect x="160" y="416" width="16" height="16" fill="#8a6b4a"/>
  <rect x="230" y="416" width="16" height="16" fill="#8a6b4a"/>
  <!-- 壁 -->
  <rect x="120" y="270" width="160" height="150" fill="#a8d4e8"/>
  <!-- 屋根（グレージュの三角） -->
  <polygon points="105,272 200,185 295,272" fill="#b8ac9a"/>
  <!-- 煙突 -->
  <rect x="236" y="190" width="24" height="26" fill="#9a8f80"/>
  <rect x="232" y="184" width="32" height="10" fill="#8a7e6e"/>
  <!-- 窓（ベージュ2つ） -->
  <rect x="140" y="300" width="40" height="40" fill="#e8d9b0"/>
  <rect x="210" y="300" width="40" height="40" fill="#e8d9b0"/>
  <line x1="160" y1="300" x2="160" y2="340" stroke="#a8d4e8" stroke-width="3"/>
  <line x1="140" y1="320" x2="180" y2="320" stroke="#a8d4e8" stroke-width="3"/>
  <line x1="230" y1="300" x2="230" y2="340" stroke="#a8d4e8" stroke-width="3"/>
  <line x1="210" y1="320" x2="250" y2="320" stroke="#a8d4e8" stroke-width="3"/>
  <!-- 扉（白） -->
  <rect x="185" y="345" width="38" height="75" fill="#ffffff"/>
  <circle cx="216" cy="382" r="3" fill="#8a6b4a"/>
  <!-- 顔（点の目2つと小さな笑口） -->
  <circle cx="170" cy="290" r="4.5" fill="#222222"/>
  <circle cx="230" cy="290" r="4.5" fill="#222222"/>
  <path d="M 188 306 Q 200 313 212 306" stroke="#222222" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- 腕（左腕は下ろし、右腕を洗濯ばさみの方へ上げる） -->
  <line x1="120" y1="330" x2="98" y2="356" stroke="#a8d4e8" stroke-width="10" stroke-linecap="round"/>
  <circle cx="94" cy="360" r="10" fill="#a8d4e8"/>
  <line x1="280" y1="330" x2="330" y2="300" stroke="#a8d4e8" stroke-width="10" stroke-linecap="round"/>
  <circle cx="334" cy="298" r="10" fill="#a8d4e8"/>
  <!-- 洗濯ばさみ（中央、大きく） -->
  <!-- 絶縁板（爪のあいだに半分抜けかけた白い板） -->
  <rect x="470" y="128" width="30" height="66" fill="#ffffff" stroke="#9aa4a8" stroke-width="2" transform="rotate(6 485 160)"/>
  <!-- 左の爪 -->
  <polygon points="448,196 476,196 482,392 456,392" fill="#d9b98a" stroke="#b99a68" stroke-width="2"/>
  <!-- 右の爪 -->
  <polygon points="494,196 522,196 514,392 488,392" fill="#d9b98a" stroke="#b99a68" stroke-width="2"/>
  <!-- バネ（金具） -->
  <circle cx="485" cy="214" r="15" fill="none" stroke="#8a8f94" stroke-width="4"/>
  <line x1="470" y1="214" x2="500" y2="214" stroke="#8a8f94" stroke-width="4"/>
  <!-- 爪に巻いた配線（銅色） -->
  <line x1="452" y1="330" x2="518" y2="330" stroke="#b0703a" stroke-width="5"/>
  <line x1="454" y1="348" x2="516" y2="348" stroke="#b0703a" stroke-width="5"/>
  <!-- 配線が箱へつながる -->
  <path d="M 485 392 Q 520 430 590 420" stroke="#b0703a" stroke-width="4" fill="none"/>
  <!-- 通知端末の小さな箱（右） -->
  <rect x="590" y="392" width="84" height="40" rx="6" fill="#5d6d7a" stroke="#42505c" stroke-width="2"/>
  <line x1="656" y1="392" x2="656" y2="352" stroke="#42505c" stroke-width="4"/>
  <circle cx="656" cy="348" r="5" fill="#42505c"/>
  <circle cx="612" cy="412" r="6" fill="#7fd08a"/>
  <rect x="632" y="404" width="26" height="5" fill="#e8eef2"/>
  <rect x="632" y="414" width="18" height="5" fill="#e8eef2"/>
</svg>
