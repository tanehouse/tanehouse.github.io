<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <!-- morning sky over Hama-Taiki -->
  <rect x="0" y="0" width="800" height="340" fill="#cfe3ee"/>
  <!-- low morning sun -->
  <circle cx="660" cy="90" r="34" fill="#f5e6a0"/>
  <circle cx="660" cy="90" r="46" fill="#f5e6a0" opacity="0.35"/>
  <!-- clouds -->
  <g fill="#ffffff" opacity="0.9">
    <ellipse cx="150" cy="80" rx="52" ry="16"/>
    <ellipse cx="190" cy="70" rx="40" ry="14"/>
    <ellipse cx="420" cy="60" rx="46" ry="13"/>
    <ellipse cx="455" cy="52" rx="34" ry="11"/>
  </g>
  <!-- birds -->
  <g stroke="#5a6b7d" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M300 130 q10 -10 20 0 q10 -10 20 0"/>
    <path d="M350 105 q8 -8 16 0 q8 -8 16 0"/>
  </g>
  <!-- distant sea (Pacific) -->
  <rect x="0" y="300" width="800" height="40" fill="#7fb3d0"/>
  <g stroke="#ffffff" stroke-width="3" fill="none" opacity="0.7">
    <path d="M60 318 q20 -6 40 0"/>
    <path d="M300 326 q20 -6 40 0"/>
    <path d="M640 316 q20 -6 40 0"/>
  </g>
  <!-- pasture ground -->
  <rect x="0" y="340" width="800" height="160" fill="#7ba05b"/>
  <polygon points="0,340 800,340 800,380 0,380" fill="#6b8f4e"/>
  <!-- grass tufts -->
  <g stroke="#5d7f43" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M240 420 l-4 -14 M240 420 l0 -16 M240 420 l4 -14"/>
    <path d="M700 430 l-4 -14 M700 430 l0 -16 M700 430 l4 -14"/>
    <path d="M330 460 l-4 -14 M330 460 l0 -16 M330 460 l4 -14"/>
  </g>
  <!-- launch pad -->
  <g>
    <rect x="520" y="400" width="120" height="10" fill="#8f8f8f" stroke="#6b6b6b" stroke-width="2"/>
    <rect x="540" y="388" width="80" height="12" fill="#a8a8a8" stroke="#7a7a7a" stroke-width="2"/>
  </g>
  <!-- smoke at the pad -->
  <g fill="#e8ecef" opacity="0.85">
    <ellipse cx="540" cy="394" rx="26" ry="12"/>
    <ellipse cx="620" cy="398" rx="30" ry="13"/>
    <ellipse cx="580" cy="386" rx="22" ry="10"/>
  </g>
  <!-- MOMO rocket ascending -->
  <g>
    <!-- flame -->
    <polygon points="566,310 580,310 592,358 580,334 573,364 566,334" fill="#f5a623"/>
    <polygon points="572,310 580,310 586,342 580,326 577,344" fill="#f5e6a0"/>
    <!-- body -->
    <rect x="566" y="190" width="28" height="122" fill="#ffffff" stroke="#9aa5ad" stroke-width="2"/>
    <!-- red nose cone -->
    <polygon points="566,190 580,160 594,190" fill="#c0392b" stroke="#96281b" stroke-width="2"/>
    <!-- fins -->
    <polygon points="566,312 552,334 566,328" fill="#c0392b"/>
    <polygon points="594,312 608,334 594,328" fill="#c0392b"/>
    <!-- MOMO marking -->
    <rect x="572" y="232" width="16" height="40" fill="#2e5a88"/>
    <text x="580" y="260" font-family="sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">M</text>
  </g>
  <!-- small cow in the pasture (dairy town) -->
  <g>
    <ellipse cx="720" cy="452" rx="34" ry="18" fill="#ffffff" stroke="#9aa5ad" stroke-width="2"/>
    <ellipse cx="712" cy="446" rx="10" ry="7" fill="#222222"/>
    <ellipse cx="732" cy="458" rx="8" ry="5" fill="#222222"/>
    <circle cx="752" cy="444" r="11" fill="#ffffff" stroke="#9aa5ad" stroke-width="2"/>
    <circle cx="748" cy="442" r="1.8" fill="#222222"/>
    <ellipse cx="754" cy="450" rx="4" ry="3" fill="#f5c6c6"/>
    <line x1="700" y1="466" x2="700" y2="486" stroke="#9aa5ad" stroke-width="3"/>
    <line x1="740" y1="466" x2="740" y2="486" stroke="#9aa5ad" stroke-width="3"/>
    <path d="M688 448 q-8 6 -4 14" stroke="#9aa5ad" stroke-width="3" fill="none"/>
  </g>
  <!-- house character, standing on the pasture, looking up at the rocket -->
  <g transform="translate(60,268) scale(0.42)">
    <!-- legs -->
    <line x1="140" y1="425" x2="140" y2="456" stroke="#5a4632" stroke-width="8" stroke-linecap="round"/>
    <line x1="200" y1="425" x2="200" y2="456" stroke="#5a4632" stroke-width="8" stroke-linecap="round"/>
    <!-- left arm down -->
    <line x1="100" y1="355" x2="78" y2="386" stroke="#5a4632" stroke-width="7" stroke-linecap="round"/>
    <circle cx="75" cy="389" r="9" fill="#5a4632"/>
    <!-- body -->
    <rect x="98" y="288" width="150" height="140" fill="#a8d4ea" stroke="#7fb3d0" stroke-width="3"/>
    <!-- roof -->
    <polygon points="80,292 173,210 266,292" fill="#c9b8a3" stroke="#a89880" stroke-width="3"/>
    <!-- chimney -->
    <rect x="212" y="222" width="24" height="40" fill="#b0a090" stroke="#8f7f6d" stroke-width="2"/>
    <!-- windows -->
    <rect x="116" y="320" width="32" height="32" fill="#f5e6c4" stroke="#7fb3d0" stroke-width="2"/>
    <rect x="192" y="320" width="32" height="32" fill="#f5e6c4" stroke="#7fb3d0" stroke-width="2"/>
    <!-- door -->
    <rect x="154" y="362" width="36" height="63" fill="#ffffff" stroke="#7fb3d0" stroke-width="2"/>
    <circle cx="184" cy="394" r="3" fill="#7fb3d0"/>
    <!-- face: dot eyes and smile above windows -->
    <circle cx="134" cy="306" r="5" fill="#222222"/>
    <circle cx="212" cy="306" r="5" fill="#222222"/>
    <path d="M160 312 Q173 320 186 312" stroke="#222222" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- right arm raised toward the rocket -->
    <line x1="248" y1="355" x2="296" y2="330" stroke="#7fb8d8" stroke-width="7" stroke-linecap="round"/>
    <circle cx="300" cy="328" r="10" fill="#7fb8d8"/>
  </g>
</svg>
