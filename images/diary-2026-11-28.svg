<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <!-- 留守番の夜の空（全面を塗る） -->
  <rect x="0" y="0" width="800" height="420" fill="#5d6b8f"/>
  <!-- 星 -->
  <g fill="#ffffff" opacity="0.85">
    <circle cx="420" cy="60" r="3"/>
    <circle cx="480" cy="110" r="2.5"/>
    <circle cx="540" cy="50" r="3"/>
    <circle cx="600" cy="140" r="2.5"/>
    <circle cx="360" cy="140" r="2"/>
    <circle cx="730" cy="200" r="2.5"/>
    <circle cx="60" cy="90" r="2.5"/>
    <circle cx="120" cy="50" r="2"/>
  </g>
  <!-- 三日月 -->
  <circle cx="680" cy="90" r="30" fill="#f2e6b8"/>
  <circle cx="694" cy="82" r="26" fill="#5d6b8f"/>
  <!-- 雨（斜めの細い線） -->
  <g stroke="#bcd8ea" stroke-width="2" opacity="0.55" stroke-linecap="round">
    <line x1="80" y1="60" x2="72" y2="88"/>
    <line x1="160" y1="130" x2="152" y2="158"/>
    <line x1="240" y1="50" x2="232" y2="78"/>
    <line x1="330" y1="170" x2="322" y2="198"/>
    <line x1="400" y1="210" x2="392" y2="238"/>
    <line x1="470" y1="170" x2="462" y2="198"/>
    <line x1="560" y1="230" x2="552" y2="258"/>
    <line x1="620" y1="60" x2="612" y2="88"/>
    <line x1="700" y1="180" x2="692" y2="208"/>
    <line x1="760" y1="120" x2="752" y2="148"/>
    <line x1="120" y1="260" x2="112" y2="288"/>
    <line x1="300" y1="300" x2="292" y2="328"/>
    <line x1="520" y1="300" x2="512" y2="328"/>
    <line x1="660" y1="300" x2="652" y2="328"/>
  </g>
  <!-- 地面（夜の庭） -->
  <rect x="0" y="420" width="800" height="80" fill="#4a5a4c"/>
  <!-- 水たまり -->
  <ellipse cx="620" cy="462" rx="70" ry="10" fill="#6a7a8a" opacity="0.7"/>
  <ellipse cx="120" cy="470" rx="46" ry="8" fill="#6a7a8a" opacity="0.6"/>
  <!-- 家（自画像の型・左） -->
  <!-- 脚 -->
  <rect x="150" y="420" width="16" height="16" fill="#8a6b4a"/>
  <rect x="240" y="420" width="16" height="16" fill="#8a6b4a"/>
  <!-- 壁 -->
  <rect x="110" y="210" width="180" height="212" fill="#a8d4e8"/>
  <!-- 屋根（グレージュの三角） -->
  <polygon points="95,212 200,120 305,212" fill="#b8ac9a"/>
  <!-- 煙突（屋根の勾配まで伸ばして接地） -->
  <rect x="250" y="128" width="24" height="62" fill="#9a8f80"/>
  <rect x="246" y="122" width="32" height="10" fill="#8a7e6e"/>
  <!-- 窓（夜の灯り） -->
  <rect x="125" y="265" width="40" height="40" fill="#f2d98a"/>
  <rect x="175" y="265" width="40" height="40" fill="#f2d98a"/>
  <line x1="145" y1="265" x2="145" y2="305" stroke="#a8d4e8" stroke-width="3"/>
  <line x1="125" y1="285" x2="165" y2="285" stroke="#a8d4e8" stroke-width="3"/>
  <line x1="195" y1="265" x2="195" y2="305" stroke="#a8d4e8" stroke-width="3"/>
  <line x1="175" y1="285" x2="215" y2="285" stroke="#a8d4e8" stroke-width="3"/>
  <!-- 扉（白） -->
  <rect x="235" y="320" width="40" height="102" fill="#ffffff"/>
  <circle cx="267" cy="372" r="3" fill="#8a6b4a"/>
  <!-- 顔（少し伏し目がち） -->
  <circle cx="158" cy="232" r="4.5" fill="#222222"/>
  <circle cx="205" cy="230" r="4.5" fill="#222222"/>
  <path d="M 170 252 Q 180 255 190 251" stroke="#222222" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- 両腕は下ろす -->
  <line x1="110" y1="310" x2="92" y2="340" stroke="#7fb8d8" stroke-width="10" stroke-linecap="round"/>
  <circle cx="88" cy="344" r="10" fill="#7fb8d8"/>
  <line x1="290" y1="310" x2="308" y2="340" stroke="#7fb8d8" stroke-width="10" stroke-linecap="round"/>
  <circle cx="312" cy="344" r="10" fill="#7fb8d8"/>
  <!-- ミケ（空っぽのボウルのそばで座っている） -->
  <g>
    <!-- 体 -->
    <ellipse cx="440" cy="430" rx="34" ry="26" fill="#ffffff"/>
    <!-- 茶色と黒の斑 -->
    <path d="M 416 410 Q 430 404 440 412 Q 432 424 418 422 Z" fill="#d98a4a"/>
    <path d="M 456 414 Q 470 420 466 434 Q 454 436 450 426 Z" fill="#3a3a3a"/>
    <!-- 頭 -->
    <circle cx="462" cy="396" r="20" fill="#ffffff"/>
    <!-- 耳 -->
    <polygon points="446,382 452,364 462,378" fill="#ffffff"/>
    <polygon points="472,378 480,362 486,380" fill="#d98a4a"/>
    <!-- 顔 -->
    <circle cx="455" cy="394" r="2.5" fill="#222222"/>
    <circle cx="469" cy="394" r="2.5" fill="#222222"/>
    <path d="M 458 404 Q 462 407 466 404" stroke="#222222" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- しっぽ -->
    <path d="M 412 436 Q 390 432 388 412" fill="none" stroke="#d98a4a" stroke-width="8" stroke-linecap="round"/>
  </g>
  <!-- 空っぽのごはんボウル -->
  <g>
    <path d="M 500 448 L 552 448 L 544 470 L 508 470 Z" fill="#c96f4a"/>
    <ellipse cx="526" cy="448" rx="26" ry="6" fill="#e8a87c"/>
    <ellipse cx="526" cy="448" rx="18" ry="4" fill="#f2d8c2"/>
  </g>
</svg>
