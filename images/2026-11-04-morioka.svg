<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="盛岡城跡公園の高い石垣を見上げるたねハウス">
  <!-- sky -->
  <rect x="0" y="0" width="800" height="500" fill="#fdf6ec"/>
  <rect x="0" y="0" width="800" height="290" fill="#dbeeff"/>
  <circle cx="668" cy="66" r="32" fill="#ffb85c"/>
  <g fill="#ffffff" opacity="0.9">
    <ellipse cx="130" cy="64" rx="56" ry="17"/>
    <ellipse cx="170" cy="52" rx="40" ry="14"/>
    <ellipse cx="470" cy="44" rx="46" ry="13"/>
  </g>
  <!-- Mt. Iwate in the far distance, fully left of the house -->
  <path d="M0 250 L72 168 L144 250 Z" fill="#b9c9d6"/>
  <path d="M54 188 L72 168 L90 188 L82 192 L72 184 L62 192 Z" fill="#ffffff"/>
  <!-- ground -->
  <rect x="0" y="290" width="800" height="210" fill="#e9dfca"/>
  <!-- tall granite stone wall, right side, sloping back as it rises:
       staggered courses, not a grid, so it reads as stonework -->
  <g>
    <polygon points="470,470 470,200 800,150 800,470" fill="#8d8d96"/>
    <g stroke="#6e6e78" stroke-width="3">
      <line x1="470" y1="262" x2="800" y2="230"/>
      <line x1="470" y1="330" x2="800" y2="300"/>
      <line x1="470" y1="400" x2="800" y2="372"/>
      <line x1="540" y1="200" x2="536" y2="262"/>
      <line x1="628" y1="192" x2="624" y2="262"/>
      <line x1="712" y1="182" x2="710" y2="262"/>
      <line x1="500" y1="262" x2="496" y2="330"/>
      <line x1="596" y1="256" x2="592" y2="330"/>
      <line x1="676" y1="248" x2="674" y2="330"/>
      <line x1="756" y1="242" x2="754" y2="330"/>
      <line x1="552" y1="330" x2="548" y2="400"/>
      <line x1="640" y1="322" x2="638" y2="400"/>
      <line x1="724" y1="314" x2="722" y2="400"/>
      <line x1="512" y1="400" x2="508" y2="470"/>
      <line x1="608" y1="392" x2="606" y2="470"/>
      <line x1="700" y1="386" x2="698" y2="470"/>
    </g>
    <g fill="#7d7d88" opacity="0.55">
      <polygon points="470,200 540,200 536,262 470,262"/>
      <polygon points="628,192 712,182 710,262 624,262"/>
      <polygon points="500,262 596,256 592,330 496,330"/>
      <polygon points="676,248 756,242 754,330 674,330"/>
      <polygon points="552,330 640,322 638,400 548,400"/>
      <polygon points="724,314 800,300 800,372 722,400"/>
    </g>
  </g>
  <!-- maple tree in front of the wall, clear of the house's raised arm -->
  <g>
    <rect x="478" y="330" width="14" height="120" fill="#6b4a2e"/>
    <g fill="#d94f2b">
      <circle cx="458" cy="310" r="42"/>
      <circle cx="510" cy="292" r="48"/>
      <circle cx="486" cy="262" r="40"/>
    </g>
    <g fill="#e8853d">
      <circle cx="438" cy="282" r="22"/>
      <circle cx="528" cy="322" r="20"/>
    </g>
  </g>
  <!-- fallen leaves on the ground -->
  <g fill="#d94f2b">
    <ellipse cx="420" cy="462" rx="10" ry="5" transform="rotate(-20 420 462)"/>
    <ellipse cx="452" cy="476" rx="10" ry="5" transform="rotate(15 452 476)"/>
  </g>
  <g fill="#e8853d">
    <ellipse cx="482" cy="470" rx="9" ry="4" transform="rotate(-12 482 470)"/>
  </g>
  <!-- house character on the left, looking up at the wall, one arm raised -->
  <g>
    <line x1="210" y1="408" x2="204" y2="452" stroke="#333" stroke-width="9" stroke-linecap="round"/>
    <line x1="260" y1="408" x2="268" y2="452" stroke="#333" stroke-width="9" stroke-linecap="round"/>
    <line x1="152" y1="330" x2="118" y2="368" stroke="#333" stroke-width="9" stroke-linecap="round"/>
    <path d="M316 318 Q356 296 372 262" stroke="#333" stroke-width="9" fill="none" stroke-linecap="round"/>
    <circle cx="376" cy="254" r="10" fill="#333"/>
    <rect x="148" y="196" width="180" height="216" rx="14" fill="#a8cdea"/>
    <path d="M128 208 L238 116 L348 208 Z" fill="#b8ab9c"/>
    <rect x="296" y="130" width="18" height="44" fill="#8a7a6a"/>
    <rect x="292" y="124" width="26" height="10" fill="#8a7a6a"/>
    <rect x="172" y="262" width="40" height="48" rx="4" fill="#f5eeda" stroke="#c9a86a" stroke-width="4"/>
    <rect x="264" y="262" width="40" height="48" rx="4" fill="#f5eeda" stroke="#c9a86a" stroke-width="4"/>
    <rect x="218" y="330" width="40" height="82" rx="4" fill="#ffffff" stroke="#c9a86a" stroke-width="4"/>
    <circle cx="212" cy="238" r="6" fill="#333"/>
    <circle cx="266" cy="238" r="6" fill="#333"/>
    <path d="M224 252 Q239 264 254 252" stroke="#333" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>
</svg>
