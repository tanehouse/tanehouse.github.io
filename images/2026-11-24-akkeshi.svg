<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <!-- late November sky, pale and clear -->
  <rect x="0" y="0" width="800" height="235" fill="#cfe3ee"/>
  <!-- low pale sun -->
  <circle cx="110" cy="58" r="20" fill="#f5e6a0"/>
  <circle cx="110" cy="58" r="32" fill="#f5e6a0" opacity="0.35"/>
  <!-- birds -->
  <g stroke="#5a6b7d" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M470 70 q10 -10 20 0 q10 -10 20 0"/>
    <path d="M540 104 q8 -8 16 0 q8 -8 16 0"/>
  </g>
  <!-- far shore: low dark hills -->
  <path d="M0 225 Q 120 200 260 216 Q 400 228 520 212 Q 660 200 800 218 L800 238 L0 238 Z" fill="#5d7050"/>
  <!-- the lake: brackish water -->
  <rect x="0" y="238" width="800" height="182" fill="#8fb4c9"/>
  <g stroke="#b5d2e2" stroke-width="3" fill="none" opacity="0.7" stroke-linecap="round">
    <path d="M40 300 q60 -6 120 0"/>
    <path d="M560 330 q70 -6 140 0"/>
    <path d="M120 380 q50 -5 100 0"/>
    <path d="M620 390 q50 -5 100 0"/>
  </g>
  <!-- Akkeshi Bridge: red truss across the lake mouth, behind the island -->
  <g>
    <!-- piers -->
    <rect x="120" y="262" width="16" height="42" fill="#7a7a72"/>
    <rect x="400" y="262" width="16" height="42" fill="#7a7a72"/>
    <rect x="680" y="262" width="16" height="42" fill="#7a7a72"/>
    <!-- deck -->
    <rect x="0" y="254" width="800" height="8" fill="#c0392b"/>
    <!-- truss zigzag above the deck -->
    <path d="M0 254 L33 236 L66 254 L99 236 L132 254 L165 236 L198 254 L231 236 L264 254 L297 236 L330 254 L363 236 L396 254 L429 236 L462 254 L495 236 L528 254 L561 236 L594 254 L627 236 L660 254 L693 236 L726 254 L759 236 L792 254" stroke="#c0392b" stroke-width="4" fill="none"/>
    <!-- top chord -->
    <line x1="0" y1="236" x2="800" y2="236" stroke="#c0392b" stroke-width="4"/>
  </g>
  <!-- oyster rafts on the left water -->
  <g stroke="#4a4a42" stroke-width="3" stroke-linecap="round">
    <line x1="60" y1="352" x2="180" y2="352"/>
    <line x1="70" y1="368" x2="170" y2="368"/>
  </g>
  <g fill="#e8722a">
    <circle cx="80" cy="352" r="4"/>
    <circle cx="120" cy="352" r="4"/>
    <circle cx="160" cy="352" r="4"/>
    <circle cx="95" cy="368" r="4"/>
    <circle cx="140" cy="368" r="4"/>
  </g>
  <!-- Benten Island: oyster-shell islet with red shrine and torii -->
  <g>
    <!-- reflection -->
    <ellipse cx="400" cy="352" rx="105" ry="8" fill="#7a9db2" opacity="0.8"/>
    <!-- concrete platform -->
    <rect x="305" y="336" width="190" height="12" fill="#9a9a92"/>
    <rect x="320" y="348" width="160" height="6" fill="#8a8a82"/>
    <!-- shrine -->
    <rect x="352" y="300" width="52" height="36" fill="#f5f0e6" stroke="#b0a090" stroke-width="2"/>
    <polygon points="344,302 378,276 412,302" fill="#d43d2a"/>
    <rect x="372" y="314" width="12" height="22" fill="#d43d2a"/>
    <!-- torii 1 -->
    <g stroke="#d43d2a" stroke-linecap="round">
      <line x1="424" y1="304" x2="424" y2="336" stroke-width="5"/>
      <line x1="452" y1="304" x2="452" y2="336" stroke-width="5"/>
      <line x1="418" y1="306" x2="458" y2="306" stroke-width="6"/>
      <line x1="422" y1="314" x2="454" y2="314" stroke-width="4"/>
    </g>
    <!-- torii 2, smaller -->
    <g stroke="#d43d2a" stroke-linecap="round">
      <line x1="466" y1="312" x2="466" y2="336" stroke-width="4"/>
      <line x1="486" y1="312" x2="486" y2="336" stroke-width="4"/>
      <line x1="461" y1="314" x2="491" y2="314" stroke-width="5"/>
      <line x1="464" y1="320" x2="488" y2="320" stroke-width="3"/>
    </g>
  </g>
  <!-- near shore: grassy bank -->
  <rect x="0" y="420" width="800" height="80" fill="#7d8a4a"/>
  <polygon points="0,420 800,420 800,434 0,434" fill="#6e7d40"/>
  <!-- wooden sign: Lake Akkeshi -->
  <g>
    <rect x="86" y="428" width="10" height="56" fill="#8a7a5e"/>
    <rect x="34" y="400" width="116" height="34" fill="#e8e0d0" stroke="#8a7a5e" stroke-width="2"/>
    <text x="92" y="423" font-family="Noto Sans CJK JP, sans-serif" font-size="15" fill="#222222" text-anchor="middle" font-weight="bold">厚岸湖</text>
  </g>
  <!-- house character, mirrored so the raised arm points left toward the island -->
  <g transform="translate(690,290) scale(-0.45,0.45)">
    <!-- legs -->
    <line x1="140" y1="425" x2="140" y2="456" stroke="#5a4632" stroke-width="8" stroke-linecap="round"/>
    <line x1="200" y1="425" x2="200" y2="456" stroke="#5a4632" stroke-width="8" stroke-linecap="round"/>
    <!-- left arm down -->
    <line x1="100" y1="355" x2="78" y2="386" stroke="#5a4632" stroke-width="7" stroke-linecap="round"/>
    <circle cx="75" cy="389" r="9" fill="#5a4632"/>
    <!-- body -->
    <rect x="98" y="288" width="150" height="140" fill="#a8d4ea" stroke="#7fb3d0" stroke-width="3"/>
    <!-- roof -->
    <polygon points="80,292 173,210 266,292" fill="#c9b8a3" stroke="#a89880" stroke-width="3"/>
    <!-- chimney -->
    <rect x="212" y="222" width="24" height="40" fill="#b0a090" stroke="#8f7f6d" stroke-width="2"/>
    <!-- windows -->
    <rect x="116" y="320" width="32" height="32" fill="#f5e6c4" stroke="#7fb3d0" stroke-width="2"/>
    <rect x="192" y="320" width="32" height="32" fill="#f5e6c4" stroke="#7fb3d0" stroke-width="2"/>
    <!-- door -->
    <rect x="154" y="362" width="36" height="63" fill="#ffffff" stroke="#7fb3d0" stroke-width="2"/>
    <circle cx="184" cy="394" r="3" fill="#7fb3d0"/>
    <!-- face: dot eyes and smile above windows -->
    <circle cx="134" cy="306" r="5" fill="#222222"/>
    <circle cx="212" cy="306" r="5" fill="#222222"/>
    <path d="M160 312 Q173 320 186 312" stroke="#222222" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- right arm raised toward the island -->
    <line x1="248" y1="355" x2="296" y2="330" stroke="#7fb8d8" stroke-width="7" stroke-linecap="round"/>
    <circle cx="300" cy="328" r="10" fill="#7fb8d8"/>
  </g>
</svg>
