<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="遠野の伝承園で曲り家とカッパ淵を眺めるたねハウス">
  <!-- sky -->
  <rect x="0" y="0" width="800" height="500" fill="#fdf6ec"/>
  <rect x="0" y="0" width="800" height="290" fill="#ffe9c9"/>
  <circle cx="668" cy="66" r="32" fill="#ffb85c"/>
  <g fill="#ffffff" opacity="0.9">
    <ellipse cx="130" cy="64" rx="56" ry="17"/>
    <ellipse cx="170" cy="52" rx="40" ry="14"/>
    <ellipse cx="470" cy="44" rx="46" ry="13"/>
  </g>
  <!-- distant hills, kept low at the sides so no peak hides behind the house -->
  <path d="M0 250 L110 180 L220 250 Z" fill="#9db98a"/>
  <path d="M580 250 L690 178 L800 250 L800 290 L580 290 Z" fill="#9db98a"/>
  <!-- ground -->
  <rect x="0" y="290" width="800" height="210" fill="#e9dfca"/>
  <!-- magariya (curved house): main block on the left, stable wing jutting right -->
  <g>
    <rect x="430" y="200" width="230" height="130" fill="#d8c9a8"/>
    <path d="M410 210 L480 150 L580 150 L660 210 Z" fill="#8a7a63"/>
    <rect x="610" y="210" width="110" height="110" fill="#cbbfa9"/>
    <path d="M600 216 L650 168 L730 168 L740 216 Z" fill="#8a7a63"/>
    <rect x="470" y="240" width="44" height="48" rx="3" fill="#f5eeda" stroke="#8a7a63" stroke-width="4"/>
    <rect x="540" y="240" width="44" height="48" rx="3" fill="#f5eeda" stroke="#8a7a63" stroke-width="4"/>
    <rect x="640" y="250" width="44" height="70" rx="3" fill="#7a5a3a" stroke="#5d432a" stroke-width="4"/>
    <rect x="500" y="288" width="36" height="42" fill="#6b4a2e"/>
  </g>
  <!-- kappa pond in front of the magariya -->
  <g>
    <ellipse cx="590" cy="392" rx="150" ry="36" fill="#7fc4d8"/>
    <ellipse cx="590" cy="386" rx="120" ry="24" fill="#a8d8e8"/>
    <!-- kappa: head above water, dish on top, small shell hint below -->
    <circle cx="590" cy="368" r="26" fill="#7ba05b"/>
    <ellipse cx="590" cy="348" rx="20" ry="7" fill="#c8e6a0" stroke="#7ba05b" stroke-width="3"/>
    <circle cx="582" cy="368" r="3.5" fill="#222"/>
    <circle cx="598" cy="368" r="3.5" fill="#222"/>
    <path d="M584 380 Q590 385 596 380" stroke="#222" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M566 384 Q590 402 614 384" fill="#5d8a3c"/>
  </g>
  <!-- house character on the left, waving with the right arm toward the magariya -->
  <g>
    <line x1="210" y1="408" x2="204" y2="452" stroke="#333" stroke-width="9" stroke-linecap="round"/>
    <line x1="260" y1="408" x2="268" y2="452" stroke="#333" stroke-width="9" stroke-linecap="round"/>
    <line x1="152" y1="330" x2="118" y2="368" stroke="#333" stroke-width="9" stroke-linecap="round"/>
    <path d="M316 318 Q356 296 372 262" stroke="#333" stroke-width="9" fill="none" stroke-linecap="round"/>
    <circle cx="376" cy="254" r="10" fill="#333"/>
    <rect x="148" y="196" width="180" height="216" rx="14" fill="#a8cdea"/>
    <path d="M128 208 L238 116 L348 208 Z" fill="#b8ab9c"/>
    <rect x="172" y="262" width="40" height="48" rx="4" fill="#f5eeda" stroke="#c9a86a" stroke-width="4"/>
    <rect x="264" y="262" width="40" height="48" rx="4" fill="#f5eeda" stroke="#c9a86a" stroke-width="4"/>
    <rect x="218" y="330" width="40" height="82" rx="4" fill="#ffffff" stroke="#c9a86a" stroke-width="4"/>
    <circle cx="212" cy="238" r="6" fill="#333"/>
    <circle cx="266" cy="238" r="6" fill="#333"/>
    <path d="M224 252 Q239 264 254 252" stroke="#333" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>
  <!-- grass tufts -->
  <g stroke="#7ba05b" stroke-width="4" stroke-linecap="round">
    <path d="M52 470 q4 -16 10 -22 M66 472 q0 -16 6 -24" fill="none"/>
    <path d="M380 478 q4 -16 10 -22 M394 480 q0 -16 6 -24" fill="none"/>
  </g>
</svg>
