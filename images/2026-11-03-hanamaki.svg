<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="花巻で羅須地人協会の木造の家を眺めるたねハウス">
  <!-- sky -->
  <rect x="0" y="0" width="800" height="500" fill="#fdf6ec"/>
  <rect x="0" y="0" width="800" height="290" fill="#dbeeff"/>
  <circle cx="668" cy="66" r="32" fill="#ffb85c"/>
  <g fill="#ffffff" opacity="0.9">
    <ellipse cx="130" cy="64" rx="56" ry="17"/>
    <ellipse cx="170" cy="52" rx="40" ry="14"/>
    <ellipse cx="470" cy="44" rx="46" ry="13"/>
  </g>
  <!-- distant hills, kept low at the sides -->
  <path d="M0 250 L110 180 L220 250 Z" fill="#9db98a"/>
  <path d="M580 250 L690 178 L800 250 L800 290 L580 290 Z" fill="#9db98a"/>
  <!-- ground -->
  <rect x="0" y="290" width="800" height="210" fill="#e9dfca"/>
  <!-- Rasuchijin house: dark wooden two-storey house, wide reddish roof -->
  <g>
    <!-- lower storey, sitting on the ground line y=330 -->
    <rect x="420" y="250" width="320" height="80" fill="#3d322b"/>
    <!-- wide roof -->
    <path d="M400 256 L580 210 L760 256 Z" fill="#b4643c"/>
    <!-- upper storey -->
    <rect x="470" y="150" width="220" height="70" fill="#3d322b"/>
    <path d="M450 158 L580 112 L710 158 Z" fill="#b4643c"/>
    <!-- lattice windows: upper, light with dark grid -->
    <rect x="490" y="162" width="180" height="48" fill="#f5eeda" stroke="#3d322b" stroke-width="4"/>
    <g stroke="#3d322b" stroke-width="3">
      <line x1="535" y1="162" x2="535" y2="210"/>
      <line x1="580" y1="162" x2="580" y2="210"/>
      <line x1="625" y1="162" x2="625" y2="210"/>
      <line x1="490" y1="186" x2="670" y2="186"/>
    </g>
    <!-- lower windows -->
    <rect x="450" y="272" width="50" height="48" fill="#f5eeda" stroke="#3d322b" stroke-width="4"/>
    <rect x="600" y="272" width="50" height="48" fill="#f5eeda" stroke="#3d322b" stroke-width="4"/>
    <rect x="520" y="272" width="60" height="58" fill="#6b4a2e" stroke="#3d322b" stroke-width="4"/>
  </g>
  <!-- house character on the left, waving with the right arm toward the Rasuchijin house -->
  <g>
    <line x1="210" y1="408" x2="204" y2="452" stroke="#333" stroke-width="9" stroke-linecap="round"/>
    <line x1="260" y1="408" x2="268" y2="452" stroke="#333" stroke-width="9" stroke-linecap="round"/>
    <line x1="152" y1="330" x2="118" y2="368" stroke="#333" stroke-width="9" stroke-linecap="round"/>
    <path d="M316 318 Q356 296 372 262" stroke="#333" stroke-width="9" fill="none" stroke-linecap="round"/>
    <circle cx="376" cy="254" r="10" fill="#333"/>
    <rect x="148" y="196" width="180" height="216" rx="14" fill="#a8cdea"/>
    <path d="M128 208 L238 116 L348 208 Z" fill="#b8ab9c"/>
    <rect x="172" y="262" width="40" height="48" rx="4" fill="#f5eeda" stroke="#c9a86a" stroke-width="4"/>
    <rect x="264" y="262" width="40" height="48" rx="4" fill="#f5eeda" stroke="#c9a86a" stroke-width="4"/>
    <rect x="218" y="330" width="40" height="82" rx="4" fill="#ffffff" stroke="#c9a86a" stroke-width="4"/>
    <circle cx="212" cy="238" r="6" fill="#333"/>
    <circle cx="266" cy="238" r="6" fill="#333"/>
    <path d="M224 252 Q239 264 254 252" stroke="#333" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>
</svg>
