<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <!-- 朝のひんやりした空と地面 -->
  <rect x="0" y="0" width="800" height="380" fill="#dbeef5"/>
  <rect x="0" y="380" width="800" height="120" fill="#cfe3c8"/>
  <!-- 遠くの山 -->
  <path d="M0 380 L150 280 L300 380 Z" fill="#a8c8b8"/>
  <path d="M520 380 L660 270 L800 380 Z" fill="#a8c8b8"/>
  <!-- 朝日（淡い） -->
  <circle cx="680" cy="90" r="48" fill="#fdf0b8"/>
  <circle cx="680" cy="90" r="48" fill="none" stroke="#f2d98c" stroke-width="3"/>
  <!-- 家キャラクター（水色の壁）: 脚は地面380に接地 -->
  <!-- 脚 -->
  <line x1="340" y1="380" x2="340" y2="410" stroke="#4a7ba6" stroke-width="10" stroke-linecap="round"/>
  <line x1="460" y1="380" x2="460" y2="410" stroke="#4a7ba6" stroke-width="10" stroke-linecap="round"/>
  <!-- 腕：右手を温度計側（右）へ上げる -->
  <line x1="470" y1="290" x2="530" y2="240" stroke="#4a7ba6" stroke-width="9" stroke-linecap="round"/>
  <circle cx="534" cy="236" r="12" fill="#4a7ba6"/>
  <line x1="330" y1="290" x2="285" y2="330" stroke="#4a7ba6" stroke-width="9" stroke-linecap="round"/>
  <circle cx="282" cy="334" r="12" fill="#4a7ba6"/>
  <!-- 本体 -->
  <rect x="320" y="180" width="160" height="200" fill="#a8d8ea" stroke="#4a7ba6" stroke-width="4"/>
  <!-- 屋根：本体の上に接地 -->
  <path d="M300 185 L400 105 L500 185 Z" fill="#e26d5a" stroke="#b84a3a" stroke-width="4" stroke-linejoin="round"/>
  <!-- 煙突：屋根の右勾配に接地（勾配上の点） -->
  <rect x="452" y="118" width="26" height="52" fill="#e8dcc8" stroke="#b8a888" stroke-width="3"/>
  <!-- 窓（目）とドア -->
  <rect x="342" y="225" width="38" height="48" fill="#ffffff" stroke="#4a7ba6" stroke-width="3"/>
  <rect x="420" y="225" width="38" height="48" fill="#ffffff" stroke="#4a7ba6" stroke-width="3"/>
  <circle cx="361" cy="249" r="7" fill="#222222"/>
  <circle cx="439" cy="249" r="7" fill="#222222"/>
  <path d="M378 300 Q400 312 422 300" fill="none" stroke="#222222" stroke-width="4" stroke-linecap="round"/>
  <rect x="382" y="312" width="36" height="68" fill="#7a5230" stroke="#5a3a20" stroke-width="3"/>
  <circle cx="410" cy="346" r="4" fill="#ffd966"/>
  <!-- 温度計（地面に立つ）：柱は地面380まで -->
  <rect x="560" y="200" width="14" height="180" fill="#ffffff" stroke="#4a7ba6" stroke-width="3"/>
  <circle cx="567" cy="380" r="26" fill="#ffffff" stroke="#4a7ba6" stroke-width="3"/>
  <circle cx="567" cy="380" r="16" fill="#e26d5a"/>
  <rect x="563" y="330" width="8" height="50" fill="#e26d5a"/>
  <text x="600" y="250" font-family="sans-serif" font-size="34" font-weight="bold" fill="#4a7ba6">13℃</text>
  <!-- 給水器：地面に置いたボウルと水の波紋 -->
  <ellipse cx="210" cy="395" rx="52" ry="16" fill="#ffffff" stroke="#4a7ba6" stroke-width="3"/>
  <ellipse cx="210" cy="388" rx="36" ry="8" fill="#bfe3f2"/>
  <path d="M185 388 q12 -6 25 0 q13 6 25 0" fill="none" stroke="#4a7ba6" stroke-width="2"/>
  <!-- 静けさ：小さな丸3つ -->
</svg>
