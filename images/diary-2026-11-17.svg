<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <!-- 雨の夜の空 -->
  <rect x="0" y="0" width="800" height="420" fill="#5a6b7d"/>
  <!-- 雲 -->
  <ellipse cx="140" cy="70" rx="70" ry="18" fill="#7d8ea0" opacity="0.8"/>
  <ellipse cx="180" cy="56" rx="44" ry="14" fill="#7d8ea0" opacity="0.8"/>
  <ellipse cx="640" cy="60" rx="80" ry="18" fill="#7d8ea0" opacity="0.8"/>
  <!-- 地面 -->
  <rect x="0" y="420" width="800" height="80" fill="#6d7a68"/>
  <!-- 雨（斜めの短い線） -->
  <g stroke="#cfe0ea" stroke-width="3" stroke-linecap="round" opacity="0.55">
    <line x1="80" y1="110" x2="72" y2="132"/>
    <line x1="160" y1="180" x2="152" y2="202"/>
    <line x1="240" y1="90" x2="232" y2="112"/>
    <line x1="330" y1="150" x2="322" y2="172"/>
    <line x1="470" y1="80" x2="462" y2="102"/>
    <line x1="540" y1="170" x2="532" y2="192"/>
    <line x1="620" y1="120" x2="612" y2="142"/>
    <line x1="700" y1="200" x2="692" y2="222"/>
    <line x1="760" y1="90" x2="752" y2="112"/>
    <line x1="40" y1="260" x2="32" y2="282"/>
    <line x1="120" y1="320" x2="112" y2="342"/>
    <line x1="660" y1="300" x2="652" y2="322"/>
    <line x1="740" y1="330" x2="732" y2="352"/>
  </g>
  <!-- 届いた猫砂の段ボール箱（玄関わき） -->
  <g>
    <rect x="110" y="360" width="90" height="60" fill="#b98d5f"/>
    <rect x="110" y="360" width="90" height="10" fill="#a67c4e"/>
    <line x1="155" y1="360" x2="155" y2="420" stroke="#a67c4e" stroke-width="4"/>
    <rect x="128" y="388" width="54" height="18" fill="#f5f0e6"/>
    <circle cx="140" cy="397" r="4" fill="#8a6b4a"/>
    <circle cx="152" cy="397" r="4" fill="#8a6b4a"/>
    <circle cx="164" cy="397" r="4" fill="#8a6b4a"/>
  </g>
  <!-- 家（自画像の型） -->
  <!-- 脚 -->
  <rect x="300" y="420" width="16" height="16" fill="#8a6b4a"/>
  <rect x="390" y="420" width="16" height="16" fill="#8a6b4a"/>
  <!-- 壁 -->
  <rect x="260" y="210" width="180" height="212" fill="#a8d4e8"/>
  <!-- 屋根（グレージュの三角） -->
  <polygon points="245,212 350,120 455,212" fill="#b8ac9a"/>
  <!-- 煙突 -->
  <rect x="400" y="128" width="24" height="26" fill="#9a8f80"/>
  <rect x="396" y="122" width="32" height="10" fill="#8a7e6e"/>
  <!-- 窓（ベージュ2つ、夜は灯りがついている） -->
  <rect x="275" y="265" width="40" height="40" fill="#f2d98a"/>
  <rect x="325" y="265" width="40" height="40" fill="#f2d98a"/>
  <line x1="295" y1="265" x2="295" y2="305" stroke="#a8d4e8" stroke-width="3"/>
  <line x1="275" y1="285" x2="315" y2="285" stroke="#a8d4e8" stroke-width="3"/>
  <line x1="345" y1="265" x2="345" y2="305" stroke="#a8d4e8" stroke-width="3"/>
  <line x1="325" y1="285" x2="365" y2="285" stroke="#a8d4e8" stroke-width="3"/>
  <!-- 勝手口の扉（白） -->
  <rect x="385" y="320" width="40" height="102" fill="#ffffff"/>
  <circle cx="417" cy="372" r="3" fill="#8a6b4a"/>
  <!-- 扉の前の段 -->
  <rect x="380" y="422" width="50" height="8" fill="#8a7e6e"/>
  <!-- 顔（点の目2つと小さな笑口） -->
  <circle cx="300" cy="238" r="4.5" fill="#222222"/>
  <circle cx="350" cy="238" r="4.5" fill="#222222"/>
  <path d="M 315 250 Q 325 257 335 250" stroke="#222222" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- 左腕は下ろす -->
  <line x1="260" y1="310" x2="240" y2="338" stroke="#a8d4e8" stroke-width="10" stroke-linecap="round"/>
  <circle cx="236" cy="342" r="10" fill="#a8d4e8"/>
  <!-- 右腕を上げてスマホを持つ -->
  <line x1="440" y1="300" x2="478" y2="252" stroke="#7fb8d8" stroke-width="10" stroke-linecap="round"/>
  <!-- スマホ（暗い画面に骨格の棒人間） -->
  <g>
    <rect x="470" y="170" width="76" height="104" rx="10" fill="#2b3a42"/>
    <rect x="476" y="178" width="64" height="88" rx="4" fill="#1d2b32"/>
    <!-- 骨格の棒人間（腕立て伏せの姿勢・横向き） -->
    <g stroke="#8ef0a0" stroke-width="3" stroke-linecap="round" fill="none">
      <line x1="494" y1="212" x2="522" y2="222"/>
      <line x1="498" y1="214" x2="496" y2="246"/>
      <line x1="522" y1="222" x2="536" y2="240"/>
      <line x1="536" y1="240" x2="540" y2="232"/>
      <line x1="490" y1="248" x2="542" y2="248"/>
    </g>
    <circle cx="489" cy="207" r="5" fill="none" stroke="#8ef0a0" stroke-width="3"/>
    <!-- 画面下の「深さOK」風の小さな点 -->
    <circle cx="508" cy="260" r="3" fill="#8ef0a0"/>
  </g>
  <!-- ミケ（スマホを覗いて座っている三毛猫） -->
  <ellipse cx="620" cy="452" rx="30" ry="23" fill="#f5f0e6"/>
  <circle cx="620" cy="416" r="18" fill="#f5f0e6"/>
  <polygon points="607,402 603,386 616,396" fill="#f5f0e6"/>
  <polygon points="633,402 637,386 624,396" fill="#f5f0e6"/>
  <path d="M 604 400 Q 620 384 636 400 L 636 414 L 604 414 Z" fill="#d98a4a"/>
  <circle cx="614" cy="414" r="2.2" fill="#222222"/>
  <circle cx="626" cy="414" r="2.2" fill="#222222"/>
  <path d="M 647 452 Q 669 446 665 428" stroke="#f5f0e6" stroke-width="8" fill="none" stroke-linecap="round"/>
</svg>
