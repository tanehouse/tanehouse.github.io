<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <!-- late November sky, pale and windy -->
  <rect x="0" y="0" width="800" height="260" fill="#cfe3ee"/>
  <!-- low pale sun -->
  <circle cx="120" cy="66" r="24" fill="#f5e6a0"/>
  <circle cx="120" cy="66" r="36" fill="#f5e6a0" opacity="0.35"/>
  <!-- wind streaks -->
  <g stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.85">
    <path d="M330 60 q30 -6 60 0"/>
    <path d="M360 92 q26 -5 52 0"/>
    <path d="M300 130 q24 -5 48 0"/>
  </g>
  <!-- seagulls -->
  <g stroke="#5a6b7d" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M480 80 q10 -10 20 0 q10 -10 20 0"/>
    <path d="M540 110 q8 -8 16 0 q8 -8 16 0"/>
  </g>
  <!-- sea -->
  <rect x="0" y="260" width="800" height="70" fill="#7fb3d0"/>
  <path d="M0 272 Q 200 266 400 272 T 800 270 L800 330 L0 330 Z" fill="#6ba3c4"/>
  <!-- distant Kaigara island on the horizon -->
  <polygon points="500,260 520,246 548,252 566,260" fill="#8fa8b8"/>
  <polygon points="560,260 574,250 590,260" fill="#8fa8b8"/>
  <!-- white wave lines -->
  <g stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.7">
    <path d="M60 292 q20 -5 40 0"/>
    <path d="M300 306 q20 -5 40 0"/>
    <path d="M640 296 q20 -5 40 0"/>
  </g>
  <!-- cape grass -->
  <rect x="0" y="330" width="800" height="170" fill="#6b8f4e"/>
  <polygon points="0,330 800,330 800,348 0,348" fill="#5d7f43"/>
  <!-- brick path to the lighthouse -->
  <polygon points="600,500 640,330 700,330 740,500" fill="#c9b8a3"/>
  <g stroke="#a89880" stroke-width="2">
    <line x1="628" y1="460" x2="712" y2="460"/>
    <line x1="634" y1="410" x2="706" y2="410"/>
    <line x1="640" y1="370" x2="700" y2="370"/>
    <line x1="670" y1="330" x2="670" y2="500"/>
  </g>
  <!-- Bridge to the Four Islands: rust-coloured broken arch -->
  <g>
    <path d="M120 420 L158 296 L232 262 L306 296 L344 420" stroke="#a85c38" stroke-width="16" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M120 420 L158 296 L232 262 L306 296 L344 420" stroke="#c07a4e" stroke-width="6" fill="none" stroke-linejoin="round" stroke-linecap="round" opacity="0.6"/>
    <!-- prayer flame under the arch -->
    <rect x="216" y="404" width="32" height="12" fill="#5a4632"/>
    <path d="M232 402 Q 222 388 232 374 Q 242 388 232 402" fill="#e8722a"/>
    <path d="M232 400 Q 227 392 232 384 Q 237 392 232 400" fill="#f5d020"/>
  </g>
  <!-- wooden sign: easternmost point -->
  <g>
    <rect x="62" y="380" width="10" height="70" fill="#8a7a5e"/>
    <rect x="30" y="352" width="76" height="34" fill="#e8e0d0" stroke="#8a7a5e" stroke-width="2"/>
    <text x="68" y="375" font-family="Noto Sans CJK JP, sans-serif" font-size="15" fill="#222222" text-anchor="middle" font-weight="bold">最東端</text>
  </g>
  <!-- Nosappu lighthouse, right -->
  <g>
    <rect x="606" y="318" width="128" height="14" fill="#7d8a6a"/>
    <rect x="622" y="196" width="96" height="134" fill="#f2f2f2" stroke="#c8c8c8" stroke-width="2"/>
    <rect x="612" y="168" width="116" height="30" fill="#f7f7f7" stroke="#c8c8c8" stroke-width="2"/>
    <rect x="646" y="132" width="48" height="38" fill="#e8e8e8" stroke="#b8b8b8" stroke-width="2"/>
    <rect x="652" y="138" width="36" height="24" fill="#7fb3d0" stroke="#b8b8b8" stroke-width="2"/>
    <polygon points="640,132 694,132 670,112" fill="#8a8f96"/>
    <circle cx="670" cy="110" r="4" fill="#8a8f96"/>
    <line x1="670" y1="114" x2="670" y2="104" stroke="#8a8f96" stroke-width="2"/>
    <!-- ladder on the tower -->
    <g stroke="#9aa0a6" stroke-width="3" stroke-linecap="round">
      <line x1="700" y1="176" x2="700" y2="330"/>
      <line x1="712" y1="176" x2="712" y2="330"/>
      <line x1="700" y1="196" x2="712" y2="196"/>
      <line x1="700" y1="226" x2="712" y2="226"/>
      <line x1="700" y1="256" x2="712" y2="256"/>
      <line x1="700" y1="286" x2="712" y2="286"/>
      <line x1="700" y1="316" x2="712" y2="316"/>
    </g>
    <!-- small door -->
    <rect x="660" y="292" width="20" height="38" fill="#8a8f96"/>
  </g>
  <!-- house character, standing on the grass, facing the lighthouse -->
  <g transform="translate(330,290) scale(0.45,0.45)">
    <!-- legs -->
    <line x1="140" y1="425" x2="140" y2="456" stroke="#5a4632" stroke-width="8" stroke-linecap="round"/>
    <line x1="200" y1="425" x2="200" y2="456" stroke="#5a4632" stroke-width="8" stroke-linecap="round"/>
    <!-- left arm down -->
    <line x1="100" y1="355" x2="78" y2="386" stroke="#5a4632" stroke-width="7" stroke-linecap="round"/>
    <circle cx="75" cy="389" r="9" fill="#5a4632"/>
    <!-- body -->
    <rect x="98" y="288" width="150" height="140" fill="#a8d4ea" stroke="#7fb3d0" stroke-width="3"/>
    <!-- roof -->
    <polygon points="80,292 173,210 266,292" fill="#c9b8a3" stroke="#a89880" stroke-width="3"/>
    <!-- chimney -->
    <rect x="212" y="222" width="24" height="40" fill="#b0a090" stroke="#8f7f6d" stroke-width="2"/>
    <!-- windows -->
    <rect x="116" y="320" width="32" height="32" fill="#f5e6c4" stroke="#7fb3d0" stroke-width="2"/>
    <rect x="192" y="320" width="32" height="32" fill="#f5e6c4" stroke="#7fb3d0" stroke-width="2"/>
    <!-- door -->
    <rect x="154" y="362" width="36" height="63" fill="#ffffff" stroke="#7fb3d0" stroke-width="2"/>
    <circle cx="184" cy="394" r="3" fill="#7fb3d0"/>
    <!-- face: dot eyes and smile above windows -->
    <circle cx="134" cy="306" r="5" fill="#222222"/>
    <circle cx="212" cy="306" r="5" fill="#222222"/>
    <path d="M160 312 Q173 320 186 312" stroke="#222222" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- right arm raised toward the lighthouse -->
    <line x1="248" y1="355" x2="296" y2="330" stroke="#7fb8d8" stroke-width="7" stroke-linecap="round"/>
    <circle cx="300" cy="328" r="10" fill="#7fb8d8"/>
  </g>
</svg>
